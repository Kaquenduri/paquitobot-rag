# Minimal Alembic configuration for the Canvas RAG backend.
# All runtime values come from environment variables (see app/core/config.py).
# The async SQLAlchemy URL is loaded by alembic/env.py from
# SUPABASE_DATABASE_URL.

[alembic]
# Path to the migration scripts directory relative to this file.
script_location = alembic

# Template used to generate migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Search path for `alembic ...` invocations; keep it explicit.
prepend_sys_path = .

# Timezone for ``created_at`` defaults; UTC for cross-tenant consistency.
timezone = UTC

# Treat the database URL as opaque; alembic/env.py owns the substitution.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
